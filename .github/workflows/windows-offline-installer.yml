name: Build Windows Offline Installer

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'frontend/**'
      - 'dist_builder/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/windows-offline-installer.yml'
    tags:
      - 'v*'
  release:
    types: [published]
  schedule:
    # Weekly Sunday build at 03:00 UTC to catch upstream updates
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      build_from_source:
        description: 'Build JAR with Frontend from repository source (true) or use latest release JAR (false)'
        required: false
        type: boolean
        default: true
      app_version:
        description: 'Version string (e.g. 2.14.3, leave blank to auto-detect)'
        required: false
        type: string
        default: ''
      upload_release:
        description: 'Upload built installer to GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build All-in-One Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Node.js
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_from_source == true }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Set up Task runner
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_from_source == true }}
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Gradle
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_from_source == true }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-installer-${{ runner.os }}-jdk-25-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle', 'app/**/build.gradle') }}
          restore-keys: |
            gradle-installer-${{ runner.os }}-jdk-25-

      - name: Cache Offline Assets
        uses: actions/cache@v4
        with:
          path: dist_builder/downloads
          key: offline-assets-v1-${{ hashFiles('dist_builder/scripts/fetch_assets.ps1') }}
          restore-keys: |
            offline-assets-v1-

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $isccDir = "C:\Program Files (x86)\Inno Setup 6"
          if (Test-Path $isccDir) {
            echo "$isccDir" >> $env:GITHUB_PATH
          }

      - name: Determine Application Version
        shell: pwsh
        run: |
          $ver = "${{ inputs.app_version }}"
          if (-not $ver -or $ver.Trim() -eq "") {
            if ("${{ github.event.release.tag_name }}") {
              $ver = "${{ github.event.release.tag_name }}"
            } elseif ($env:GITHUB_REF -like "refs/tags/v*") {
              $ver = $env:GITHUB_REF.Substring(11)
            } else {
              try {
                $releaseInfo = Invoke-RestMethod -Uri "https://api.github.com/repos/Stirling-Tools/Stirling-PDF/releases/latest" -Headers @{"User-Agent"="GitHub-Action"}
                $ver = $releaseInfo.tag_name
              } catch {
                $ver = "2.14.3"
              }
            }
          }
          $cleanVer = $ver.TrimStart('v')
          Write-Host "Resolved installer version: $cleanVer"
          echo "INSTALLER_VERSION=$cleanVer" >> $env:GITHUB_ENV

      - name: Build JAR with Web UI from source
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_from_source == true }}
        shell: pwsh
        run: |
          cd frontend
          npm ci
          cd ..
          ./gradlew bootJar -PbuildWithFrontend=true -PjpdfiumPlatforms=windows-x64 -x test -x spotlessCheck -x sonarqube --no-daemon

      - name: Compile Windows Installer (.exe)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File dist_builder\scripts\build_installer.ps1 -AppVersion $env:INSTALLER_VERSION

      - name: Compute SHA-256 Checksum
        shell: pwsh
        run: |
          $exePath = "dist_builder\output\StirlingPDF-Full-Setup.exe"
          $hash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash
          $shaFile = "dist_builder\output\StirlingPDF-Full-Setup.exe.sha256"
          Set-Content -Path $shaFile -Value "$hash  StirlingPDF-Full-Setup.exe"
          Write-Host "SHA256: $hash"
          echo "INSTALLER_SHA256=$hash" >> $env:GITHUB_ENV

      - name: Upload Installer as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StirlingPDF-Full-Setup-${{ env.INSTALLER_VERSION }}
          path: |
            dist_builder/output/StirlingPDF-Full-Setup.exe
            dist_builder/output/StirlingPDF-Full-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Tagged Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.upload_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            dist_builder/output/StirlingPDF-Full-Setup.exe
            dist_builder/output/StirlingPDF-Full-Setup.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Rolling Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-installer-latest
          name: Windows Offline Installer (latest build)
          body: |
            Automated build of the Windows offline installer.

            - Version: ${{ env.INSTALLER_VERSION }}
            - Commit: ${{ github.sha }}
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - SHA256: ${{ env.INSTALLER_SHA256 }}

            Quick download: `StirlingPDF-Full-Setup.exe` below (stable URL via the `windows-installer-latest` tag).
          prerelease: true
          make_latest: false
          files: |
            dist_builder/output/StirlingPDF-Full-Setup.exe
            dist_builder/output/StirlingPDF-Full-Setup.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
